name: Create Functional Pearl discussion weekly

on:
  schedule:
    - cron: "0 12 * * 5" # 5 = Friday (12:00 UTC)
  workflow_dispatch:

jobs:
  create-discussion:
    runs-on: ubuntu-latest
    permissions:
      discussions: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y jq
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Extract entry for today or next week
        id: extract
        run: |
          FILE=".github/workflows/files/functional-pearls.yaml"

          # Decide date based on trigger
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET_DATE=$(date +'%Y-%m-%d')
          else
            TARGET_DATE=$(date -d '+7 days' +'%Y-%m-%d')
          fi

          ENTRY=$(yq -o=json "$FILE" | jq -c --arg d "$TARGET_DATE" '.[] | select(.date == $d)')
          if [ -z "$ENTRY" ]; then
            echo "No entry for $TARGET_DATE" >&2
            exit 1
          fi

          echo "date=$TARGET_DATE" >> $GITHUB_ENV
          echo "title=$(echo "$ENTRY" | jq -r '.title')" >> $GITHUB_ENV
          echo "link=$(echo "$ENTRY" | jq -r '.link')" >> $GITHUB_ENV
          echo "authorship=$(echo "$ENTRY" | jq -r '.authorship')" >> $GITHUB_ENV

      # Use the Create Discussion action
      - name: Create a new GitHub Discussion
        id: create-discussion
        uses: abirismyname/create-discussion@main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          title: "Functional Pearl: ${{ env.date }}: ${{ env.title }}"
          body: |
            **This week's Functional Pearl**

            **Title:** ${{ env.title }}
            **Authors:** ${{ env.authorship }}
            **Paper link:** [${{ env.link }}](${{ env.link }})

          category-name: PaperReading
          repository-name: lllssskkk/Weekly_Paper_For_Fun

      # Optional step to print discussion details
      - name: Print discussion URL and ID
        run: |
          echo "Discussion ID: ${{ steps.create-discussion.outputs.discussion-id }}"
          echo "Discussion URL: ${{ steps.create-discussion.outputs.discussion-url }}"
